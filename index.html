<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="L7 MATRIX">
<title>L7 MATRIX V0.2</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="page">
  <div class="login">
    <div class="logo">L7</div><div class="matrix">MATRIX</div>
    <div class="sub">MOBILE WEB DIAGNOSTIC V0.2</div>
    <input id="code" placeholder="輸入測試序號" autocomplete="off">
    <button id="enter">進入 L7 MATRIX</button>
    <p class="hint">測試碼：L7TEST</p><p id="err"></p>
  </div>
</div>

<div id="main" class="page hide">
  <header><b>L7 MATRIX</b><span>V0.2 診斷模式</span></header>
  <section class="panel">
    <h2>AU8 內嵌測試</h2>
    <p>這版先測試 AU8 是否允許在 L7 MATRIX 頁面內載入。</p>
    <div class="status"><b id="state">尚未開始</b><small id="detail">按下方按鈕開始測試</small></div>
    <button id="embed">在 L7 MATRIX 內開啟 AU8</button>
    <button id="normal" class="secondary">一般方式開啟 AU8</button>
  </section>
  <section id="frameWrap" class="frameWrap hide">
    <div class="frameTop"><span>AU8 EMBED TEST</span><button id="close">關閉</button></div>
    <iframe id="gameFrame" title="AU8 test"></iframe>
  </section>
  <section class="notes">
    <b>判讀方式</b>
    <p>若下方能顯示 AU8 首頁並可操作，代表「內嵌」第一關通過。若空白、拒絕連線或自動跳出，代表網站有跨站/框架限制。</p>
  </section>
</div>
<script src="app.js"></script>
</body></html>
