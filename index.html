<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>L7 MATRIX V0.3</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="brand"><strong>L7</strong><span>MATRIX</span></div>
  <div class="tag">V0.3 · SCREEN CAPTURE CAPABILITY TEST</div>

  <section class="card">
    <h1>iPhone 畫面擷取測試</h1>
    <p>這版只測 Safari 是否提供可供 L7 使用的螢幕擷取介面，不會登入平台、不會下注，也不會上傳畫面。</p>

    <div class="status">
      <span>瀏覽器檢測</span>
      <b id="support">檢測中…</b>
    </div>

    <button id="start">開始畫面擷取測試</button>
    <button id="stop" class="secondary" disabled>停止測試</button>

    <div id="result" class="result">尚未開始。</div>
  </section>

  <section class="card preview">
    <div class="row"><b>本機預覽</b><small>只有成功取得串流才會顯示</small></div>
    <video id="video" autoplay playsinline muted></video>
  </section>

  <section class="card">
    <b>如何判讀</b>
    <p class="small">若顯示「API 不存在」，代表目前這個 iPhone Safari/PWA 不能用這個網頁方法取得螢幕畫面；若跳出系統授權並能看到預覽，才代表可以繼續研究即時影像辨識。</p>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
