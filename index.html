<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d16">
<link rel="manifest" href="manifest.json">
<title>L7 MATRIX</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC",sans-serif;color:#f7f9ff;background:#070b12;min-height:100vh}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 12% 10%,#ff5a161c,transparent 30%),radial-gradient(circle at 90% 8%,#1478ff24,transparent 34%);pointer-events:none}
.wrap{width:min(430px,100%);margin:auto;min-height:100vh;padding:54px 22px 32px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px}.mark{width:48px;height:48px;border-radius:15px;border:1px solid #ffffff1c;background:linear-gradient(135deg,#ff741a24,#1d78ff2d);display:grid;place-items:center;font-weight:950;font-style:italic;font-size:23px}.mark i{color:#ff781c}.mark b{color:#3998ff}
h1{font-size:20px;margin:0;letter-spacing:1px}.sub{font-size:8px;letter-spacing:2px;color:#8995a9;margin-top:4px}
.card{margin-top:42px;padding:24px 18px;border:1px solid #ffffff17;border-radius:22px;background:#111824d9;box-shadow:0 24px 70px #0008;backdrop-filter:blur(18px)}
.kicker{font-size:10px;letter-spacing:2px;color:#78869d}.title{font-size:26px;font-weight:850;margin:8px 0 6px}.desc{font-size:13px;color:#8f9caf;line-height:1.6}
input{width:100%;margin-top:22px;padding:16px;border-radius:14px;border:1px solid #ffffff1b;background:#080d15;color:white;font-size:16px;letter-spacing:1.5px;outline:none}
button,.platform{width:100%;border:0;border-radius:14px;padding:15px;margin-top:12px;font-size:15px;font-weight:800;color:white;background:linear-gradient(100deg,#ff641e,#675cff 56%,#168aff);cursor:pointer;text-decoration:none;display:block;text-align:left}
button span{float:right}.msg{height:22px;margin-top:10px;font-size:12px;color:#ff8585}.hidden{display:none}
.platform{background:#0b111b;border:1px solid #ffffff18}.platform small{display:block;font-size:10px;font-weight:500;color:#8290a4;margin-top:4px}.platform strong{font-size:18px}
.foot{margin-top:auto;padding-top:30px;text-align:center;color:#4e5a6c;font-size:9px;letter-spacing:1.4px}
.badge{display:inline-block;padding:5px 8px;border-radius:99px;background:#51e3a31b;color:#76e9b7;font-size:9px;margin-top:12px}
</style>
</head>
<body><main class="wrap">
<div class="brand"><div class="mark"><span><i>L</i><b>7</b></span></div><div><h1>L7 MATRIX</h1><div class="sub">RESULT · RULE · DISCIPLINE</div></div></div>

<section id="login" class="card">
<div class="kicker">MEMBER ACCESS</div><div class="title">專屬授權</div>
<div class="desc">輸入你的 L7 授權碼後進入平台選擇。</div>
<input id="code" autocomplete="one-time-code" placeholder="輸入授權碼">
<button onclick="verify()">驗證授權 <span>→</span></button>
<div id="msg" class="msg"></div>
</section>

<section id="platforms" class="card hidden">
<div class="kicker">PLATFORM</div><div class="title">選擇平台</div>
<div class="desc">登入後請使用你自己的平台帳號正常登入。</div>
<div class="badge">● ACCESS ACTIVE</div>
<a class="platform" href="https://www.88au8.net/mobile/#/home"><strong>AU8</strong><small>開啟平台 →</small></a>
</section>
<div class="foot">L7 MATRIX · WEB V1.0</div>
</main>
<script>
// DEMO ONLY. Production 24-hour codes must be verified server-side.
// Replace this demo verifier with a server/API before issuing real member codes.
function verify(){
 const v=document.getElementById('code').value.trim().toUpperCase();
 const msg=document.getElementById('msg');
 if(v==="L7TEST"){
   sessionStorage.setItem("l7_access","1");
   document.getElementById('login').classList.add('hidden');
   document.getElementById('platforms').classList.remove('hidden');
 }else msg.textContent="授權碼無效或已失效";
}
if(sessionStorage.getItem("l7_access")==="1"){
 document.getElementById('login').classList.add('hidden');
 document.getElementById('platforms').classList.remove('hidden');
}
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script></body></html>
