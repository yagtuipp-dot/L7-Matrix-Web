<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#07111f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="L7 MATRIX">
  <title>L7 MATRIX</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="login" class="screen">
      <div class="glow"></div>
      <div class="card login-card">
        <div class="logo">L7</div>
        <div class="matrix">MATRIX</div>
        <div class="sub">MOBILE ANALYZER ACCESS</div>
        <label for="code">授權序號</label>
        <input id="code" autocomplete="off" placeholder="輸入測試序號">
        <button id="loginBtn">進入 L7 MATRIX</button>
        <p class="hint">V0.1 測試碼：<b>L7TEST</b></p>
        <p id="error" class="error"></p>
      </div>
    </section>

    <section id="platforms" class="screen hidden">
      <header>
        <div><b>L7 MATRIX</b><small>合作平台</small></div>
        <button class="ghost" id="logoutBtn">登出</button>
      </header>
      <div class="content">
        <h1>選擇平台</h1>
        <p class="muted">第一階段先驗證 iPhone → AU8 手機站流程。</p>
        <button class="platform" id="au8Btn">
          <span class="platform-logo">AU8</span>
          <span><b>AU8</b><small>使用平台原本登入頁面</small></span>
          <span class="arrow">›</span>
        </button>
        <div class="notice">
          <b>測試重點</b>
          <p>確認 Safari/PWA 可正常開啟 AU8、登入並進入後續遊戲頁面。</p>
        </div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
